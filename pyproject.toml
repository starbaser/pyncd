[project]
name = "pyncd"
version = "0.1.0"
description = "Algebraic neural circuit diagrams and PyTorch compilation"
readme = "README.md"
requires-python = ">=3.13"
# The relay and its clients, which `pyncd-server` and `websocket_transfer` need.
dependencies = ["websockets>=15"]

[project.scripts]
pyncd-server = "websocket_transfer.serve:main"

[project.optional-dependencies]
torch = ["torch>=2.5", "einops>=0.8.1", "numpy>=2"]
# notebooks/display imports IPython through ipykernel, which requirements.txt lists,
# and pandas, which it imports and requirements.txt does not list.
diagrams = ["ipykernel>=6.29.5", "pandas>=2"]
headless = ["playwright"]

# What the validation runner needs to execute the notebooks.
[dependency-groups]
dev = [
  "nbclient>=0.10", "nbformat>=5.10", "jupyter_client>=8", "ipykernel>=6.29.5",
  "matplotlib>=3.10",
  # hatch_build.py imports the build backend, and the import check imports it.
  "hatchling>=1.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The tsncd page the wheel carries, written by `hatch_build.py` from this revision.
[tool.pyncd.tsncd]
repository = "https://github.com/starbaser/tsncd.git"
revision = "9fce9f498501c2044a49f594df27bb6dc85b4e9f"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = [
  "advanced_axis_dynamics", "agent_display", "algebra", "caching",
  "construction_helpers", "data_structure", "data_transfer", "deepseek", "display",
  "graphs", "para", "performance_modeling", "quantization", "solver",
  "term_utilities", "torch_compile", "utilities", "websocket_transfer",
]

# The notebook drawing helper, which draws through the tsncd bundle. The other
# notebooks and their saved outputs stay out of the wheel.
[tool.hatch.build.targets.wheel.force-include]
"notebooks/display" = "notebooks/display"
